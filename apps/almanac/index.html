<body>
<div class="app">
  <header class="top"><a class="back" href="https://shrimp-guard.us.ci/projects/">← 作品入口</a>
    <h1>台灣天象曆</h1>
    <p class="sub">接下來一年從台灣看得到的天象：日月食、超級月亮、行星衝日與大距、月亮和行星相會、流星雨、二十四節氣。時間都是台灣時間，全部在你的瀏覽器裡用天文公式算出來，可以一鍵加進手機行事曆。</p>
  </header>
  <section id="next" class="next" aria-live="polite"></section>
  <div class="bar">
    <div class="chips" role="group" aria-label="分類" id="cats"></div>
    <label class="vis"><input type="checkbox" id="visOnly" checked> 只列台灣看得到的</label>
    <button type="button" id="dlAll" class="ghost">全部加入行事曆（.ics）</button>
  </div>
  <div id="list" class="list"></div>
  <p class="fine">計算：Astronomy Engine（MIT）。食的時刻精確到分鐘；「相會」指兩者在天上最接近的時刻，前後一晚都很接近。流星雨極大期依國際流星組織的年度平均日期。</p>
</div>
