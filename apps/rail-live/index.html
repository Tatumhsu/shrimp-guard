<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台鐵即時列車</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=20261017155214">
</head>
<body>
<div id="map" aria-label="台鐵路網地圖"></div>
<button type="button" id="d3" class="btn d3" aria-pressed="false" title="立體地形，山的光影跟著畫面上的時間">3D 地形</button>

<section class="hud" aria-label="狀態">
  <h1>台鐵即時列車</h1>
  <div class="clock"><span id="clock">--:--:--</span><span id="mode" class="mode">即時</span></div>
  <p class="sub"><b id="running">0</b> 班行駛中・<span id="date"></span></p>
  <div class="types" id="types" role="group" aria-label="車種"></div>
  <form class="find" id="find" role="search">
    <input id="q" inputmode="numeric" placeholder="車次或車站" aria-label="搜尋車次或車站" autocomplete="off">
    <ul id="sugg" class="sugg" role="listbox" hidden></ul>
  </form>
</section>

<section class="time" aria-label="時間">
  <button type="button" id="live" class="btn on">即時</button>
  <select id="day" aria-label="日期"></select>
  <input type="range" id="slider" min="240" max="1560" step="1" aria-label="時間軸">
  <div class="speeds" role="group" aria-label="播放速度">
    <button type="button" data-speed="0" class="btn">暫停</button>
    <button type="button" data-speed="60" class="btn">60×</button>
    <button type="button" data-speed="600" class="btn">600×</button>
  </div>
</section>

<aside class="panel" id="panel" hidden aria-live="polite">
  <button type="button" class="close" id="close" aria-label="關閉">×</button>
  <div id="pbody"></div>
</aside>

<p class="note">依台鐵公開時刻表推算位置，不含誤點。路線：© OpenStreetMap 貢獻者。</p>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/astronomy.browser.min.js"></script>
<script src="terrain.js?v=20261017155214"></script>
<script src="app.js?v=20261017155214"></script>
</body>
</html>
