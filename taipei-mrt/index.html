<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<title>台北捷運互動地圖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC','Helvetica Neue',Arial,sans-serif;
  background:#f5f0e8;overflow:hidden;height:100vh;width:100vw;
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;
}
#header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:linear-gradient(180deg,#f5f0e8 0%,rgba(245,240,232,0.95) 80%,transparent);
  padding:12px 16px 8px;text-align:center;
}
#header h1{font-size:1.3rem;font-weight:900;letter-spacing:-0.02em}
#header p{font-size:0.7rem;color:#888;margin-top:-2px}

#canvasWrap{
  position:fixed;top:0;left:0;right:0;bottom:0;
  overflow:hidden;cursor:grab;
}
#canvasWrap:active{cursor:grabbing}
#mapCanvas{display:block;width:100%;height:100%}

#controls{
  position:fixed;bottom:24px;right:20px;z-index:100;
  display:flex;flex-direction:column;gap:6px;
}
#controls button{
  width:44px;height:44px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.92);font-size:22px;font-weight:700;
  cursor:pointer;color:#444;box-shadow:0 2px 8px rgba(0,0,0,0.1);
  backdrop-filter:blur(4px);transition:all 0.1s;
}
#controls button:active{transform:scale(0.92)}

#legend{
  position:fixed;top:52px;left:10px;z-index:100;
  display:flex;flex-direction:column;gap:4px;
}
#legend button{
  display:flex;align-items:center;gap:6px;
  border:none;background:rgba(255,255,255,0.85);border-radius:16px;
  padding:4px 10px 4px 4px;font-size:11px;font-weight:700;
  cursor:pointer;color:#444;box-shadow:0 1px 4px rgba(0,0,0,0.06);
  font-family:inherit;transition:all 0.12s;white-space:nowrap;
}
#legend button:active{transform:scale(0.95)}
#legend button .dot{
  width:14px;height:14px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(255,255,255,0.7);
}
#legend button.active{box-shadow:0 0 0 2px #333 inset;filter:brightness(1.05)}
#legend button.hidden{opacity:0.35}

#info{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:100;display:none;
  background:rgba(255,252,248,0.96);border-radius:16px;
  padding:16px 20px;width:min(340px,calc(100vw-32px));
  box-shadow:0 8px 28px rgba(0,0,0,0.12);border:1px solid rgba(200,190,170,0.3);
  backdrop-filter:blur(8px);
}
#info.show{display:block;animation:up 0.18s ease}
@keyframes up{from{opacity:0;transform:translateX(-50%) translateY(8px)}}
#info .close{position:absolute;top:6px;right:10px;border:none;background:none;font-size:18px;cursor:pointer;color:#999}
#info h3{font-size:1rem;font-weight:700}
#info .code{font-size:0.7rem;color:#888;margin-bottom:4px}
#info .lines{font-size:0.75rem;margin-bottom:8px}
#info .lines span{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:0.65rem;font-weight:700;margin-right:3px}
#info .poi{font-size:0.75rem;color:#555}
#info .poi span{display:inline-block;background:#f0ebe3;padding:2px 8px;border-radius:8px;margin:2px 4px 2px 0;font-size:0.7rem}

@media(max-width:640px){
  #header h1{font-size:1rem}
  #legend{top:48px;left:6px;gap:3px}
  #legend button{font-size:10px;padding:3px 8px 3px 3px}
  #legend button .dot{width:12px;height:12px}
  #controls{bottom:16px;right:12px}
  #controls button{width:38px;height:38px;font-size:18px}
}
</style>
</head>

};// ====== RENDER ENGINE ======
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');

let W, H;
let zoom = 1, panX = 0, panY = 0;
let dragStart = null, isDrag = false;
let visible = {BR:true,R:true,G:true,O:true,BL:true,Y:true};
let sel = null;

function resize() {
  W = canvas.width = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
  draw();
}

function toScreen(wx, wy) {
  return [(wx + panX) * zoom + W/2, (wy + panY) * zoom + H/2];
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();

  // 畫網格
  ctx.strokeStyle = 'rgba(100,90,70,0.06)';
  ctx.lineWidth = 1;
  const gs = 30 * zoom;
  if (gs > 8) {
    for (let x = -2000; x < 2000; x += 30) {
      const [sx] = toScreen(x, 0);
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    }
    for (let y = -2000; y < 2000; y += 30) {
      const [, sy] = toScreen(0, y);
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
    }
  }

  // 畫路線
  const order = ['R','G','BL','O','BR','Y'];
  for (const lid of order) {
    if (!visible[lid]) continue;
    const route = DATA.routes[lid];
    if (!route) continue;
    const color = COLORS[lid];
    const stations = route.map(c => DATA.stations[c]).filter(Boolean);
    if (stations.length < 2) continue;

    // 畫主線 path
    ctx.beginPath();
    let first = true;
    for (const s of stations) {
      const [sx, sy] = toScreen(s.x, s.y);
      if (first) { ctx.moveTo(sx, sy); first = false; }
      else ctx.lineTo(sx, sy);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 5 * zoom;
    ctx.globalAlpha = 0.7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 蘆洲支線
    if (lid === 'O') {
      const branch = DATA.routes.O_branch;
      if (branch) {
        ctx.beginPath();
        first = true;
        for (const c of branch) {
          const s = DATA.stations[c];
          if (!s) continue;
          const [sx, sy] = toScreen(s.x, s.y);
          if (first) { ctx.moveTo(sx, sy); first = false; }
          else ctx.lineTo(sx, sy);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 5 * zoom;
        ctx.globalAlpha = 0.7;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  // 畫車站（第二遍，在上面）
  for (const lid of order) {
    if (!visible[lid]) continue;
    const route = DATA.routes[lid];
    if (!route) continue;
    const color = COLORS[lid];
    for (const code of route) {
      const s = DATA.stations[code];
      if (!s) continue;
      const [sx, sy] = toScreen(s.x, s.y);
      const r = s.tr ? (6 * zoom) : (4.5 * zoom);
      const isSel = sel === code;

      // 外圈
      if (isSel) {
        ctx.beginPath();
        ctx.arc(sx, sy, r + 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,200,0,0.5)';
        ctx.fill();
      }

      // 圓點
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(r, 3), 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2.5 * zoom, 1.5);
      ctx.stroke();

      // 站名
      if (zoom > 0.6) {
        const fs = Math.max(10 * zoom, 7);
        const fontSize = Math.min(fs, 14);
        ctx.font = `500 ${fontSize}px "Noto Sans TC","Helvetica Neue",Arial,sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#333';
        // 背景
        const tw = ctx.measureText(s.n).width;
        const ty = sy - r - 3;
        ctx.fillStyle = 'rgba(245,240,232,0.7)';
        ctx.fillRect(sx - tw/2 - 2, ty - fontSize, tw + 4, fontSize + 2);
        ctx.fillStyle = '#333';
        ctx.fillText(s.n, sx, ty - 1);
      }
    }
  }
  ctx.restore();
}

// ====== INTERACTION ======
wrap.addEventListener('mousedown', e => {
  dragStart = {x:e.clientX, y:e.clientY, px:panX, py:panY};
  isDrag = false;
});
document.addEventListener('mousemove', e => {
  if (!dragStart) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDrag = true;
  if (isDrag) {
    panX = dragStart.px + dx / zoom;
    panY = dragStart.py + dy / zoom;
    draw();
  }
});
document.addEventListener('mouseup', e => {
  if (dragStart && !isDrag) {
    // 點擊：找最近車站
    const mx = (e.clientX - W/2) / zoom - panX;
    const my = (e.clientY - H/2) / zoom - panY;
    let best = null, bestDist = 15 / zoom;
    for (const [code, s] of Object.entries(DATA.stations)) {
      const dx = s.x - mx, dy = s.y - my;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < bestDist) { bestDist = dist; best = code; }
    }
    if (best) showStation(best);
    else hideInfo();
  }
  dragStart = null;
});

// 觸控
let touchStart = null;
wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchStart = {x:t.clientX, y:t.clientY, px:panX, py:panY};
    isDrag = false;
  }
}, {passive: true});
wrap.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && touchStart) {
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDrag = true;
    if (isDrag) {
      panX = touchStart.px + dx / zoom;
      panY = touchStart.py + dy / zoom;
      draw();
    }
  }
  // 雙指縮放
  if (e.touches.length === 2) {
    e.preventDefault();
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    if (touchStart && touchStart.dist) {
      const scale = dist / touchStart.dist;
      zoom = Math.max(0.3, Math.min(3, touchStart.zoom * scale));
      draw();
    } else {
      touchStart = touchStart || {};
      touchStart.dist = dist;
      touchStart.zoom = zoom;
    }
  }
}, {passive: false});
wrap.addEventListener('touchend', e => {
  if (touchStart && !isDrag && e.changedTouches.length === 1) {
    const t = e.changedTouches[0];
    const mx = (t.clientX - W/2) / zoom - panX;
    const my = (t.clientY - H/2) / zoom - panY;
    let best = null, bestDist = 20 / zoom;
    for (const [code, s] of Object.entries(DATA.stations)) {
      const dx = s.x - mx, dy = s.y - my;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < bestDist) { bestDist = dist; best = code; }
    }
    if (best) showStation(best);
  }
  touchStart = null;
}, {passive: true});

// 滾輪縮放
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  zoom = Math.max(0.3, Math.min(3, zoom + delta));
  draw();
}, {passive: false});

// 縮放按鈕
document.getElementById('zoomin').onclick = () => { zoom = Math.min(3, zoom + 0.15); draw(); };
document.getElementById('zoomout').onclick = () => { zoom = Math.max(0.3, zoom - 0.15); draw(); };

// ====== INFO ======
function showStation(code) {
  sel = code;
  const s = DATA.stations[code];
  if (!s) return;
  document.getElementById('infoTitle').textContent = s.n;
  document.getElementById('infoCode').textContent = code;

  // 路線
  let linesHtml = '';
  const lids = [];
  for (const [lid, route] of Object.entries(DATA.routes)) {
    if (route.includes(code)) lids.push(lid);
    if (lid === 'O_branch' && route.includes(code)) lids.push('O');
  }
  for (const lid of [...new Set(lids)]) {
    linesHtml += `<span style="background:${COLORS[lid]}">${LINE_NAMES[lid]}</span>`;
  }
  document.getElementById('infoLines').innerHTML = linesHtml;

  // 景點
  const poi = DATA.pois[code];
  document.getElementById('infoPoi').innerHTML = poi ? '📍 <strong>附近：</strong>' + poi.map(p => `<span>${p}</span>`).join('') : '';

  document.getElementById('info').classList.add('show');
  draw();
}
document.getElementById('infoClose').onclick = hideInfo;
function hideInfo() {
  sel = null;
  document.getElementById('info').classList.remove('show');
  draw();
}

// ====== LEGEND ======
const legend = document.getElementById('legend');
const order = ['R','G','BL','O','BR','Y'];
for (const lid of order) {
  const btn = document.createElement('button');
  btn.innerHTML = `<span class="dot" style="background:${COLORS[lid]}"></span>${LINE_NAMES[lid]}`;
  btn.dataset.line = lid;
  btn.classList.add('active');
  btn.onclick = () => {
    visible[lid] = !visible[lid];
    btn.classList.toggle('active');
    btn.classList.toggle('hidden');
    draw();
  };
  legend.appendChild(btn);
}

// ====== INIT ======
window.addEventListener('resize', resize);
resize();</script></body></html>
