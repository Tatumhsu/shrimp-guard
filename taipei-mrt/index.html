// ====== RENDER ======
const ca=document.getElementById('c'),cx=ca.getContext('2d');
const wr=document.getElementById('wrap');
let W,H,z=1,px=-90,py=-120,ds=null,dr=false,sl=null;
let vi={R:true,BL:true,G:true,O:true,BR:true,Y:true};

function rs(){
  W=ca.width=wr.clientWidth;
  H=ca.height=wr.clientHeight;
  drw();
}

function ts(wx,wy){
  return [(wx*G+px)*z+W/2,(wy*G+py)*z+H/2];
}

function drw(){
  cx.clearRect(0,0,W,H);
  const ord=['R','BL','G','O','BR','Y'];

  // Draw routes
  for(const lid of ord){
    if(!vi[lid])continue;
    const rt=R[lid];if(!rt)continue;
    const col=C[lid];

    // Main line
    cx.beginPath();
    let f=true;
    for(const code of rt){
      const s=S[code];if(!s)continue;
      const[sx,sy]=ts(s.x,s.y);
      if(f){cx.moveTo(sx,sy);f=false;}
      else cx.lineTo(sx,sy);
    }
    cx.strokeStyle=col;cx.lineWidth=5*z;cx.globalAlpha=0.6;
    cx.lineCap='round';cx.lineJoin='round';cx.stroke();
    cx.globalAlpha=1;

    // Branch line (蘆洲支線)
    if(lid==='O'&&R.OB){
      cx.beginPath();f=true;
      for(const code of R.OB){
        const s=S[code];if(!s)continue;
        const[sx,sy]=ts(s.x,s.y);
        if(f){cx.moveTo(sx,sy);f=false;}
        else cx.lineTo(sx,sy);
      }
      cx.strokeStyle=col;cx.lineWidth=5*z;cx.globalAlpha=0.6;cx.stroke();
      cx.globalAlpha=1;
    }
  }

  // Draw stations (second pass)
  for(const lid of ord){
    if(!vi[lid])continue;
    const rt=R[lid];if(!rt)continue;
    const col=C[lid];
    for(const code of rt){
      const s=S[code];if(!s)continue;
      const[sx,sy]=ts(s.x,s.y);
      const r=s.t?6*z:4.5*z;
      const is=sl===code;

      if(is){
        if(z>0.35){
          cx.beginPath();cx.arc(sx,sy,r+4,0,Math.PI*2);
          cx.fillStyle='rgba(255,200,0,0.35)';cx.fill();
        }
      }

      cx.beginPath();cx.arc(sx,sy,Math.max(r,2.5),0,Math.PI*2);
      cx.fillStyle='#fff';cx.fill();
      cx.strokeStyle=col;cx.lineWidth=Math.max(2.5*z,1.5);cx.stroke();

      // Transfer station ring
      if(s.t&&z>0.5){
        cx.beginPath();cx.arc(sx,sy,Math.max(r+2,4),0,Math.PI*2);
        cx.strokeStyle=col;cx.lineWidth=Math.max(1.2*z,0.8);cx.stroke();
      }

      // Station name
      if(z>0.4&&s.t){
        let fs=Math.min(Math.max(10*z,7),13);
        cx.font='500 '+fs+'px "Noto Sans TC","Helvetica Neue",Arial,sans-serif';
        cx.textAlign='center';
        const tw=cx.measureText(s.n).width;
        const ty=sy-r-4;
        cx.fillStyle='rgba(245,240,232,0.7)';
        cx.fillRect(sx-tw/2-2,ty-fs,tw+4,fs+2);
        cx.fillStyle='#333';cx.fillText(s.n,sx,ty-1);
      }else if(z>0.7){
        let fs=Math.min(Math.max(9*z,7),12);
        cx.font='400 '+fs+'px "Noto Sans TC","Helvetica Neue",Arial,sans-serif';
        cx.textAlign='center';
        const tw=cx.measureText(s.n).width;
        const ty=sy-r-3;
        cx.fillStyle='rgba(245,240,232,0.65)';
        cx.fillRect(sx-tw/2-2,ty-fs,tw+4,fs+2);
        cx.fillStyle='#555';cx.fillText(s.n,sx,ty-1);
      }
    }
  }
}

// INTERACTION
wr.addEventListener('mousedown',e=>{ds={x:e.clientX,y:e.clientY,px,py};dr=false;});
document.addEventListener('mousemove',e=>{
  if(!ds)return;
  const dx=e.clientX-ds.x,dy=e.clientY-ds.y;
  if(Math.abs(dx)>3||Math.abs(dy)>3)dr=true;
  if(dr){px=ds.px+dx/z;py=ds.py+dy/z;drw();}
});
document.addEventListener('mouseup',e=>{
  if(ds&&!dr){
    const mx=(e.clientX-W/2)/z-px,my=(e.clientY-H/2)/z-py;
    let b=null,bd=18/z;
    for(const[k,s]of Object.entries(S)){
      const d=Math.hypot(s.x*G-mx,s.y*G-my);
      if(d<bd){bd=d;b=k;}
    }
    if(b)sh(b);else hi();
  }
  ds=null;
});

// Touch
let ts2=null;
wr.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    const t=e.touches[0];
    ts2={x:t.clientX,y:t.clientY,px,py};dr=false;
  }
},{passive:true});
wr.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&ts2){
    const t=e.touches[0];
    const dx=t.clientX-ts2.x,dy=t.clientY-ts2.y;
    if(Math.abs(dx)>3||Math.abs(dy)>3)dr=true;
    if(dr){px=ts2.px+dx/z;py=ts2.py+dy/z;drw();}
  }
  if(e.touches.length===2){
    e.preventDefault();
    const t1=e.touches[0],t2=e.touches[1];
    const d=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
    if(ts2&&ts2.d){const sc=d/ts2.d;z=Math.max(0.3,Math.min(3,ts2.z*sc));drw();}
    else{if(!ts2)ts2={};ts2.d=d;ts2.z=z;}
  }
},{passive:false});
wr.addEventListener('touchend',e=>{
  if(ts2&&!dr&&e.changedTouches.length===1){
    const t=e.changedTouches[0];
    const mx=(t.clientX-W/2)/z-px,my=(t.clientY-H/2)/z-py;
    let b=null,bd=22/z;
    for(const[k,s]of Object.entries(S)){
      const d=Math.hypot(s.x*G-mx,s.y*G-my);
      if(d<bd){bd=d;b=k;}
    }
    if(b)sh(b);
  }
  ts2=null;
},{passive:true});

wr.addEventListener('wheel',e=>{
  e.preventDefault();
  z=Math.max(0.3,Math.min(3,z+(e.deltaY>0?-0.1:0.1)));
  drw();
},{passive:false});

zi.onclick=()=>{z=Math.min(3,z+0.15);drw();};
zo.onclick=()=>{z=Math.max(0.3,z-0.15);drw();};

// STATION INFO
function sh(code){
  sl=code;
  const s=S[code];if(!s)return;
  it.textContent=s.n;ic.textContent=code;
  let h='';
  const ls=[];
  if(s.t)ls.push(...s.t);
  else{
    for(const[lid,rt]of Object.entries(R)){
      if(lid==='OB'&&rt.includes(code)){ls.push('O');break;}
      if(rt.includes(code)){ls.push(lid);break;}
    }
  }
  for(const lid of[...new Set(ls)]){
    h+='<span style="background:'+C[lid]+'">'+N[lid]+'</span>';
  }
  il.innerHTML=h;
  const pp=P[code]||[];
  if(pp.length)ip.innerHTML='📍<strong>附近：</strong>'+pp.map(p=>'<span>'+p+'</span>').join('');
  else ip.innerHTML='';
  info.classList.add('show');drw();
}
ix.onclick=hi;
function hi(){sl=null;info.classList.remove('show');drw();}

// LEGEND
const legend=document.getElementById('legend');
for(const lid of['R','BL','G','O','BR','Y']){
  const b=document.createElement('button');
  b.innerHTML='<span class="d" style="background:'+C[lid]+'"></span>'+N[lid];
  b.classList.add('on');
  b.onclick=()=>{vi[lid]=!vi[lid];b.classList.toggle('on');b.classList.toggle('off');drw();};
  legend.appendChild(b);
}

window.addEventListener('resize',rs);
rs();
</script>
