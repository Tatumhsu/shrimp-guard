<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>未來世界</title><meta name="robots" content="noindex,nofollow">
<meta name="description" content="AI 小隊（Claude、Grok、Codex）每天追蹤新信號，更新 2026–2060 年的世界里程碑時間軸。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css"><script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('embed')</script></head>
<body>
<div class="app">
  <header class="top"><a class="back" href="./">← 回到時光之城</a></header>
  <div class="mast">
    <div><span class="kicker">FUTURE WORLD · AI TEAM FORECAST</span><h1>未來世界</h1>
      <p class="lede">AI 小隊每天追蹤新信號，推估這些事會在哪一年發生。</p></div>
    <div class="mast-r"><span id="meta" class="meta">讀取中…</span></div>
  </div>

  <section class="today" aria-labelledby="todayH">
    <h2 id="todayH">今日變化 <small id="todayDate"></small></h2>
    <p id="summary" class="summary"></p>
    <div class="team" id="team"></div>
  </section>

  <div class="controls">
    <div class="seg" role="group" aria-label="檢視方式">
      <button type="button" data-view="timeline" aria-pressed="true">時間軸</button>
      <button type="button" data-view="list" aria-pressed="false">清單</button>
    </div>
    <label class="born">我的出生年 <input id="born" type="number" inputmode="numeric" min="1920" max="2026" placeholder="例 1990"></label>
    <nav class="chips" id="chips" aria-label="領域篩選"></nav>
  </div>

  <section id="timelineView" class="tlwrap" aria-label="時間軸">
    <div class="tlscroll" id="tlscroll"><div class="tl" id="tl"></div></div>
    <p class="hint">● 最可能的年份　▬ 80% 可能區間　點任一項看依據與變化</p>
  </section>
  <section id="listView" class="list" hidden aria-label="清單"></section>

  <section aria-labelledby="sigH">
    <h2 id="sigH">最新信號 <small>讓時間軸移動的新聞、論文與政策</small></h2>
    <div id="signals" class="signals"></div>
  </section>

  <footer class="fine">年份是 AI 小隊綜合專家、預測市場與新聞後的推估，不是預言，也不構成投資建議。每項都附來源，重要判斷請點原文確認。<br>
  Claude 負責搜尋與調整、Grok 提供 X 上的即時討論、Codex 審查調整幅度；沒接通的隊友會標示出來。</footer>
</div>

<div id="tip" class="tip" role="tooltip" hidden></div>
<aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dTitle">
  <div class="dpanel">
    <button type="button" class="close" id="dClose" aria-label="關閉">✕</button>
    <div id="dBody"></div>
  </div>
</aside>
<script type="module" src="app.js"></script>
</body></html>
