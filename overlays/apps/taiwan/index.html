<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣此刻</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
  <header class="top">
    <div class="title"><a class="back" href="https://shrimp-guard.us.ci/projects/">← 作品入口</a><h1>台灣此刻</h1></div>
    <nav class="tabs" role="tablist" aria-label="分頁">
      <a role="tab" href="#map" data-tab="map">地圖</a><a role="tab" href="#sky" data-tab="sky">星空</a><a role="tab" href="#almanac" data-tab="almanac">天象曆</a><a role="tab" href="#relief" data-tab="relief">立體光影</a><a role="tab" href="#sound" data-tab="sound">聲音</a>
    </nav>
  </header>

  <section id="tab-map" class="pane" role="tabpanel" aria-label="地圖">
    <p id="summary" class="summary">讀取資料中…</p>
    <div class="maplayout">
      <div class="stage">
        <div id="map" aria-label="台灣地圖，點任一處看天氣"></div>
        <div id="stamp" class="stamp" hidden></div>
        <div class="timebar" id="fcBar">
          <button type="button" id="play" class="ghost" aria-pressed="false" aria-label="播放預報">▶</button>
          <input id="slider" type="range" min="0" max="48" step="1" value="0" aria-label="預報時間（風、氣溫、降雨、PM2.5、海況）">
          <output id="clock" class="clock"></output>
        </div>
      </div>
      <aside class="side">
        <section class="box"><h2>圖層</h2>
          <div class="group"><h3>天氣（可往後播 48 小時）</h3>
            <label><input type="checkbox" id="lyWind" checked> 風的流線</label>
            <div class="seg" role="group" aria-label="底色"><button type="button" data-bg="none">無底色</button><button type="button" data-bg="wind">風速</button><button type="button" data-bg="temp">氣溫</button><button type="button" data-bg="rain">降雨</button><button type="button" data-bg="aq">PM2.5</button><button type="button" data-bg="wave">浪高</button><button type="button" data-bg="sst">海溫</button></div>
          </div>
          <div class="group"><h3>衛星雲圖（過去 3 小時循環）</h3>
            <div class="seg" role="group" aria-label="雲圖"><button type="button" data-cloud="off">關</button><button type="button" data-cloud="ir">紅外線</button><button type="button" data-cloud="vis">可見光</button><button type="button" data-cloud="air">氣團</button></div>
          </div>
          <div class="group"><h3>地震（過去 30 天）</h3><label><input type="checkbox" id="lyQuake" checked> 顯示地震</label></div>
          <div class="group"><h3>景點預報</h3>
            <div class="seg" role="group" aria-label="景點預報"><button type="button" data-spot="off">關</button><button type="button" data-spot="s">火燒雲</button><button type="button" data-spot="r">日出</button><button type="button" data-spot="star">觀星</button><button type="button" data-spot="sea">雲海</button><button type="button" data-spot="beach">海邊</button></div>
            <div class="seg days" role="group" aria-label="日期" id="spotDays"></div>
          </div>
          <div id="legend" class="legend"></div>
        </section>
        <section class="box"><h2>最近地震</h2><ol id="quakeList" class="rows"></ol></section>
        <section class="box"><h2 id="spotTitle">景點排名</h2><ol id="spotList" class="rows"></ol></section>
      </aside>
    </div>
    <p class="fine">資料：天氣、PM2.5 與海況預報 Open-Meteo（含 CAMS 空品模式與海洋波浪模式）；雲圖 Himawari-9（日本氣象廳，經 NASA GIBS，約晚 30–60 分鐘）；地震 USGS。正式警報請以中央氣象署為準。</p>
  </section>

  <section id="tab-frame" class="pane" role="tabpanel" hidden><div id="frames"></div></section>
</div>
<script src="vendor/leaflet.js"></script>
<script src="vendor/astronomy.browser.min.js"></script>
<script type="module" src="app.js"></script>
</body></html>
