<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣鄉鎮圖鑑</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css"><script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('embed')</script></head>
<body>
<div class="app">
  <header class="top"><a class="back" href="https://shrimp-guard.us.ci/projects/">← 作品入口</a>
    <div class="head"><h1>台灣鄉鎮圖鑑</h1><p class="sub">368 個鄉鎮市區，一個一個認識。點地圖看它的故事、特色與美食；去過的就蓋章，看看你走過台灣多少地方。</p></div>
  </header>
  <div class="bar">
    <form class="find" id="find" role="search"><input id="q" placeholder="找鄉鎮，例如：九份、瑞芳、竹山" aria-label="搜尋鄉鎮" autocomplete="off"><ul id="sugg" class="sugg" role="listbox" hidden></ul></form>
    <div class="seg" role="group" aria-label="地圖上色"><button type="button" data-color="tag" aria-pressed="true">特色</button><button type="button" data-color="rail">台鐵車站</button><button type="button" data-color="stamp">我的足跡</button></div>
    <button type="button" id="today" class="ghost">今日鄉鎮</button><button type="button" id="random" class="ghost">隨機探索</button>
  </div>
  <div class="layout">
    <div class="mapwrap"><div id="map" aria-label="台灣鄉鎮地圖"></div><div id="legend" class="legend"></div></div>
    <aside id="card" class="card" aria-live="polite"></aside>
  </div>
  <section class="passport"><h2>我的集章 <span id="stampCount" class="count"></span></h2><div id="stampBar" class="stampbar"></div><div id="stampList" class="stamplist"></div></section>
  <p class="fine">鄉鎮界線：內政部鄉鎮市區界線（經 taiwan-atlas，MIT）；介紹依中文維基百科導言改寫（CC BY-SA 4.0，由 Claude 撰寫，可能有誤，請以原文為準）；美食店家數來自「美食大蒐集」；車站來自台鐵時刻表。集章只存在你的瀏覽器。</p>
</div>
<script src="vendor/leaflet.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script type="module" src="app.js"></script>
</body></html>
