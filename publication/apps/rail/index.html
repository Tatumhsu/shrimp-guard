<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣鐵道</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#0b1117;--panel:#121b23;--ink:#e6edf2;--ink2:#a5b4bf;--ink3:#73838f;--rule:#22303b;--accent:#4fd1b5;
  --f-display:"LXGW WenKai TC","Kaiti TC",serif;--f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
body{display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:8px 16px;border-bottom:1px solid var(--rule)}
.title{display:flex;align-items:baseline;gap:12px}
.back{font-size:13px;color:var(--ink3);text-decoration:none}
h1{font-family:var(--f-display);font-size:24px;letter-spacing:.12em;margin:0}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.tabs a{flex:none;color:var(--ink2);text-decoration:none;padding:7px 14px;border-radius:999px;font-size:14px;min-height:38px;display:flex;align-items:center;gap:6px;border:1px solid transparent}
.tabs a small{color:var(--ink3);font-size:11px}
.tabs a[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.tabs a[aria-selected="true"] small{color:#43515c}
.tabs a:not([aria-selected="true"]):hover{border-color:var(--rule);color:var(--ink)}
.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;position:relative;min-height:0}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
main iframe[hidden]{display:none}
@media (max-width:640px){h1{font-size:20px}.tabs a{padding:6px 11px;font-size:13px}.tabs a small{display:none}}
</style></head>
<body>
<header class="top">
  <div class="title"><a class="back" href="https://shrimp-guard.us.ci/projects/">← 作品入口</a><h1>台灣鐵道</h1></div>
  <nav class="tabs" role="tablist" aria-label="分頁">
    <a role="tab" href="#live" data-tab="live">即時列車<small>全台每班車在哪</small></a>
    <a role="tab" href="#weekend" data-tab="weekend">週末出走<small>去哪站吃什麼</small></a>
    <a role="tab" href="#pingxi" data-tab="pingxi">平溪線沙盤<small>3D 半日遊</small></a>
    <a role="tab" href="#mrt" data-tab="mrt">台北捷運<small>路線圖</small></a>
  </nav>
</header>
<main id="frames"></main>
<script>
// One page for every rail tool; each loads once (lazily) and keeps its state while you switch tabs.
const SRC = { live: '../rail-live/?embed=1', weekend: '/weekend/?embed=1', pingxi: '/rail-trip/?embed=1', mrt: 'https://shrimp-guard.us.ci/taipei-mrt/' };
function show(t) {
  if (!SRC[t]) t = 'live';
  document.querySelectorAll('[data-tab]').forEach(a => a.setAttribute('aria-selected', String(a.dataset.tab === t)));
  let f = document.querySelector(`iframe[data-tab="${t}"]`);
  if (!f) { f = document.createElement('iframe'); f.dataset.tab = t; f.src = SRC[t]; f.title = document.querySelector(`[data-tab="${t}"]`).firstChild.textContent; f.allow = 'geolocation; fullscreen'; document.getElementById('frames').append(f); }
  document.querySelectorAll('main iframe').forEach(x => { x.hidden = x !== f; });
  document.title = `${f.title}・台灣鐵道`;
}
addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || 'live');
</script>
</body></html>
