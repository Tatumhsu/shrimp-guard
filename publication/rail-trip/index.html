<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b2a3a">
<meta name="description" content="平溪線半日鐵道旅行沙盤：在低多邊形 3D 鐵道世界裡點車站、排景點、看火車跑，用官方時刻表算出可行行程。">
<title>鐵道出走沙盤</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b2a3a'/%3E%3Crect x='7' y='8' width='18' height='14' rx='3' fill='%23f3e6c8'/%3E%3Crect x='7' y='13' width='18' height='3' fill='%23e8742c'/%3E%3Ccircle cx='11' cy='25' r='2' fill='%23f3e6c8'/%3E%3Ccircle cx='21' cy='25' r='2' fill='%23f3e6c8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=20261007125517">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<canvas id="world" aria-label="平溪線 3D 鐵道世界（示意圖）"></canvas>
<div id="labels" aria-hidden="false"></div>

<header id="topbar">
  <button id="brand" class="chip chip-brand" type="button" aria-label="鐵道出走沙盤 — 關於與資料來源">
    <span class="logo" aria-hidden="true"></span><span class="brand-text">鐵道出走<b>沙盤</b></span>
  </button>
  <button id="datepill" class="chip" type="button" aria-label="設定日期與時間">
    <span id="pill-date">—</span><span class="sep">·</span><span id="pill-time">—</span>
  </button>
  <div class="spacer"></div>
  <button id="btn-preview" class="chip chip-icon" type="button" aria-label="火車行進預覽" title="火車行進預覽">▶</button>
  <button id="btn-menu" class="chip chip-icon" type="button" aria-label="更多：保存、開啟、匯出、重新開始" title="更多">⋯</button>
</header>

<div id="scene-note" class="note" aria-live="polite"><b>鐵道出走沙盤</b> · 示意圖，非實際比例 · 火車位置為估算，非即時 GPS</div>

<div id="preview-hud" class="hud" hidden>
  <div class="hud-clock"><span id="hud-time">--:--</span><span class="hud-tag">估算</span></div>
  <div id="hud-text" class="hud-text">—</div>
  <div class="hud-actions">
    <button id="hud-speed" class="mini" type="button" aria-label="播放速度">×1</button>
    <button id="hud-pause" class="mini" type="button" aria-label="暫停或繼續">⏸</button>
    <button id="hud-stop" class="mini" type="button" aria-label="結束預覽">✕</button>
  </div>
</div>

<section id="sheet" class="sheet peek" aria-label="行程面板">
  <div id="sheet-handle" class="handle" role="button" tabindex="0" aria-label="展開或收合面板"><span></span></div>
  <div id="peekbar" class="peekbar" role="status" aria-live="polite">
    <span id="peek-status" class="status st-idle">載入中</span>
    <span id="peek-text" class="peek-text">正在載入官方時刻表…</span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="plan" role="tab" type="button">行程</button>
    <button class="tab" data-tab="station" role="tab" type="button">車站</button>
    <button class="tab" data-tab="settings" role="tab" type="button">設定</button>
    <button class="tab" data-tab="sources" role="tab" type="button">資料</button>
  </nav>
  <div id="sheet-body" class="sheet-body">
    <section id="tab-plan" class="tabpane active" role="tabpanel"></section>
    <section id="tab-station" class="tabpane" role="tabpanel"></section>
    <section id="tab-settings" class="tabpane" role="tabpanel"></section>
    <section id="tab-sources" class="tabpane" role="tabpanel"></section>
  </div>
</section>

<div id="loading" class="overlay">
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">正在載入官方時刻表與景點資料…</p>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js?v=20261007125517"></script>
</body>
</html>
