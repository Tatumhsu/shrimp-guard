<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ee">
<meta name="description" content="美食大蒐集：打開就定位、邊打字邊找，全台 22 縣市 1.7 萬家店。附近美食、推薦吃法、隱藏美食、夜市入口，資料來自觀光署開放資料與 OpenStreetMap。">
<title>美食大蒐集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23d9472a'/%3E%3Ctext x='20' y='27' font-size='20' text-anchor='middle'%3E%F0%9F%8D%B1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/vendor/leaflet.markercluster/MarkerCluster.css">
<link rel="stylesheet" href="assets/vendor/leaflet.markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
 <header class="top">
  <div class="top-row">
   <span class="logo">🍱 美食大蒐集</span>
   <button id="loc-chip" class="loc-chip" title="重新定位"><span class="loc-dot"></span><span id="loc-text">定位中…</span></button>
  </div>
  <div class="search-row">
   <input id="q" type="search" placeholder="即時搜尋全台：店名、食物、鄉鎮…（例：肉圓、牛肉麵、東區）" autocomplete="off" aria-label="即時搜尋">
   <button id="q-clear" class="q-clear" aria-label="清除搜尋" hidden>×</button>
  </div>
  <nav class="modes" aria-label="找法">
   <button class="mode mode-on" data-mode="near">📍 附近</button>
   <button class="mode" data-mode="rec">👍 推薦</button>
   <button class="mode" data-mode="hidden">🕵️ 隱藏美食</button>
   <button class="mode" data-mode="market">🏮 夜市</button>
   <button class="mode" data-mode="fav">♡ 收藏</button>
  </nav>
 </header>

 <div id="city-panel" class="city-panel" hidden>
  <div class="panel-head"><strong>手選縣市</strong><button class="link" data-close-city>收起</button></div>
  <div id="city-grid" class="city-grid"></div>
  <p class="muted small">定位成功時會自動鎖定你所在縣市；手選縣市會改以該縣市為範圍（不是你的位置）。</p>
 </div>

 <section id="screen-results" class="screen">
  <div class="filters">
   <div class="filter-row"><span class="filter-label">範圍</span><div class="chips" id="dist-chips"><button class="chip" data-dist="500">500 m</button><button class="chip chip-on" data-dist="1500">1.5 km</button><button class="chip" data-dist="5000">5 km</button><button class="chip" data-dist="0">整個縣市</button></div><button class="chip chip-ghost" data-open-city>🏙️ 縣市</button></div>
   <div class="filter-row"><span class="filter-label">分類</span><div class="chips scroll" id="cat-chips"></div></div>
  </div>
  <div class="result-head">
   <div><strong id="result-title">附近</strong><div class="muted" id="result-line"></div></div>
   <div class="seg" role="group" aria-label="檢視"><button id="seg-list" class="seg-on" data-view="list">列表</button><button id="seg-map" data-view="map">地圖</button></div>
  </div>
  <div id="rec-tools" class="rec-tools" hidden>
   <button id="dice" class="btn-dice">🎲 隨機抽一家</button>
   <span class="muted small">依「資料完整度＋在地特色」排序，不是評分</span>
  </div>
  <div id="hidden-note" class="note" hidden></div>
  <div class="list-map">
   <div id="list-view" class="cards"></div>
   <div id="map-view" class="map-wrap" hidden>
    <div id="map" class="map"></div>
    <div class="map-legend"><span><i class="lg me"></i>你的位置</span><span><i class="lg shop"></i>店家</span><span><i class="lg hid"></i>隱藏美食</span><span><i class="lg market"></i>夜市／市場入口</span></div>
    <div class="map-sheet" id="map-sheet"></div>
   </div>
  </div>
  <div id="more" class="more"></div>
 </section>

 <section id="screen-market" class="screen" hidden></section>
 <section id="screen-detail" class="screen" hidden></section>

 <footer class="about">
  <details><summary>資料來源與方法</summary><ul id="about-list"></ul></details>
  <p class="muted small" id="status-strip">載入中…</p>
 </footer>
</div>
<div id="toast" role="status"></div>
<noscript><p class="noscript">請啟用 JavaScript 以定位與搜尋店家。</p></noscript>
<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="assets/vendor/leaflet.markercluster/leaflet.markercluster.js"></script>
<script src="app.js" defer></script>
</body>
</html>
