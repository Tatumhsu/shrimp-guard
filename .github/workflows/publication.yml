name: Validate preserved publication
on:
  push:
    branches: [main, safety/publication-projects]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/check_publication_head.py
      - run: python scripts/build_publication.py
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-publication
          path: public/
          include-hidden-files: true
# Deliberately validation-only pending review; existing Pages mode is gh-pages branch root.
